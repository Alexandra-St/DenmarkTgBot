name: Folketinget backup restore PoC

on:
  workflow_dispatch:
    inputs:
      confirm_restore:
        description: "Confirm a temporary, non-production restore of the official ODA backup"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: folketinget-backup-restore-poc
  cancel-in-progress: false

jobs:
  restore-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify and restore official backup
        env:
          INPUT_CONFIRM_RESTORE: ${{ inputs.confirm_restore }}
          ODA_BACKUP_USERNAME: ${{ secrets.ODA_BACKUP_USERNAME }}
          ODA_BACKUP_PASSWORD: ${{ secrets.ODA_BACKUP_PASSWORD }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 tools/folketinget_backup_poc.py
