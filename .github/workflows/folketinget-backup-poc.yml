name: Folketinget backup restore PoC

on:
  workflow_dispatch:
    inputs:
      confirm_restore:
        description: "Confirm the requested manual PoC operation"
        required: true
        type: boolean
        default: false
      mode:
        description: "Choose a manual restore, validation, manifest, diff, extraction, relevance, snapshot-client dry-run, or production readiness preflight"
        required: true
        type: choice
        options:
          - RESTORE_VALIDATE
          - VALIDATE_SQL_PROVIDER
          - CREATE_MANIFEST_BASELINE
          - DIFF_MANIFESTS
          - EXTRACT_SNAPSHOT_CANDIDATES
          - CLASSIFY_SNAPSHOT_CANDIDATES
          - PREPARE_SNAPSHOT_INGESTION
          - SNAPSHOT_INGESTION_DRY_RUN
          - HISTORICAL_SNAPSHOT_BASELINE_DRY_RUN
          - HISTORICAL_SNAPSHOT_PRODUCTION_PREFLIGHT
        default: RESTORE_VALIDATE
      old_run_id:
        description: "Successful manual baseline run ID for the older manifest (diff/extraction/classification/preparation/snapshot-client dry-run modes)"
        required: false
        type: string
      new_run_id:
        description: "Successful manual baseline run ID for the newer manifest (diff/extraction/classification/preparation/snapshot-client dry-run modes)"
        required: false
        type: string
      manifest_run_id:
        description: "Successful CREATE_MANIFEST_BASELINE run ID for the historical baseline dry-run"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: folketinget-backup-restore-poc
  cancel-in-progress: false

jobs:
  restore-poc:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Production snapshot readiness preflight
        if: inputs.mode == 'HISTORICAL_SNAPSHOT_PRODUCTION_PREFLIGHT'
        env:
          INPUT_CONFIRM_RESTORE: ${{ inputs.confirm_restore }}
          INGEST_API_URL: ${{ vars.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from urllib.parse import urlsplit

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, new_url):
                  return None

          def finish(status, category=None, readiness=None):
              fields = []
              if readiness is not None:
                  fields = [
                      f"- Schema ready: {str(readiness['schema_ready']).lower()}",
                      f"- Snapshot state initialized: {str(readiness['snapshot_state_initialized']).lower() if readiness['snapshot_state_initialized'] is not None else 'unknown'}",
                      f"- Snapshot generation: {readiness['snapshot_generation'] if readiness['snapshot_generation'] is not None else 'null'}",
                      f"- Active ingestion run: {str(readiness['active_ingestion_run']).lower() if readiness['active_ingestion_run'] is not None else 'unknown'}",
                      f"- Worker supports snapshot ingestion: {str(readiness['worker_supports_snapshot_ingestion']).lower()}",
                      f"- Historical snapshot start allowed: {str(readiness['historical_snapshot_start_allowed']).lower()}",
                  ]
              lines = [f"Production snapshot readiness preflight: {status}", "", *fields]
              if category:
                  lines.extend(["", f"- Error category: {category}"])
              report = "\n".join(lines) + "\n"
              print(report, end="")
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as summary:
                      summary.write(report)

          if os.environ.get("INPUT_CONFIRM_RESTORE") != "true":
              finish("FAIL", "manual_confirmation_required")
              sys.exit(2)
          base = os.environ.get("INGEST_API_URL", "")
          token = os.environ.get("INGEST_API_TOKEN", "")
          try:
              parsed = urlsplit(base)
          except ValueError:
              finish("FAIL", "ingestion_endpoint_invalid")
              sys.exit(2)
          if (parsed.scheme != "https" or not parsed.hostname or parsed.username is not None
                  or parsed.password is not None or parsed.query or parsed.fragment or parsed.path not in ("", "/")):
              finish("FAIL", "ingestion_endpoint_invalid")
              sys.exit(2)
          if not token:
              finish("FAIL", "ingestion_configuration_missing")
              sys.exit(2)
          request = urllib.request.Request(
              base.rstrip("/") + "/internal/snapshot-readiness?source=folketinget",
              method="GET",
              headers={"Authorization": "Bearer " + token, "Accept": "application/json"},
          )
          opener = urllib.request.build_opener(NoRedirect())
          try:
              with opener.open(request, timeout=15) as response:
                  if response.status != 200:
                      finish("FAIL", "worker_request_rejected")
                      sys.exit(2)
                  raw_body = response.read(4097)
                  if len(raw_body) > 4096:
                      finish("FAIL", "readiness_response_invalid")
                      sys.exit(2)
                  body = json.loads(raw_body.decode("utf-8"))
          except (urllib.error.URLError, TimeoutError, OSError, UnicodeDecodeError, json.JSONDecodeError):
              finish("FAIL", "worker_request_failed")
              sys.exit(2)
          expected_keys = {
              "source", "schema_ready", "snapshot_state_initialized", "snapshot_generation",
              "active_ingestion_run", "worker_supports_snapshot_ingestion", "historical_snapshot_start_allowed",
          }
          nullable_booleans = ("snapshot_state_initialized", "active_ingestion_run")
          if (not isinstance(body, dict) or set(body) != expected_keys or body.get("source") != "folketinget"
                  or any(not isinstance(body.get(key), bool) for key in (
                      "schema_ready", "worker_supports_snapshot_ingestion", "historical_snapshot_start_allowed"))
                  or any(body.get(key) is not None and not isinstance(body.get(key), bool) for key in nullable_booleans)
                  or (body.get("snapshot_generation") is not None and
                      (isinstance(body.get("snapshot_generation"), bool) or not isinstance(body.get("snapshot_generation"), int)))):
              finish("FAIL", "readiness_response_invalid")
              sys.exit(2)
          if body["snapshot_generation"] is not None and body["snapshot_generation"] < 1:
              finish("FAIL", "readiness_response_invalid")
              sys.exit(2)
          safe = {key: body[key] for key in expected_keys}
          status = "PASS" if safe["historical_snapshot_start_allowed"] is True else "BLOCKED"
          finish(status, readiness=safe)
          if status != "PASS":
              sys.exit(2)
          PY
      - name: Validate manifest run IDs and artifacts
        if: inputs.mode == 'DIFF_MANIFESTS' || inputs.mode == 'EXTRACT_SNAPSHOT_CANDIDATES' || inputs.mode == 'CLASSIFY_SNAPSHOT_CANDIDATES' || inputs.mode == 'PREPARE_SNAPSHOT_INGESTION' || inputs.mode == 'SNAPSHOT_INGESTION_DRY_RUN'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          OLD_RUN_ID: ${{ inputs.old_run_id }}
          NEW_RUN_ID: ${{ inputs.new_run_id }}
        run: |
          set -euo pipefail
          for run_id in "$OLD_RUN_ID" "$NEW_RUN_ID"; do
            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
              echo "snapshot_diff=FAIL category=workflow_run_id_invalid"
              exit 2
            fi
          done
          if [[ "$OLD_RUN_ID" == "$NEW_RUN_ID" ]]; then
            echo "snapshot_diff=FAIL category=workflow_run_ids_must_differ"
            exit 2
          fi
          workflow_id=$(gh api "repos/$GH_REPOSITORY/actions/workflows/folketinget-backup-poc.yml" --jq '.id') || {
            echo "snapshot_diff=FAIL category=manifest_run_not_successful"
            exit 2
          }
          if [[ ! "$workflow_id" =~ ^[0-9]+$ ]]; then
            echo "snapshot_diff=FAIL category=manifest_run_not_successful"
            exit 2
          fi
          for run_id in "$OLD_RUN_ID" "$NEW_RUN_ID"; do
            run_path="repos/$GH_REPOSITORY/actions/runs/$run_id"
            run_fields=$(gh api "$run_path" --jq '[.id, .status, .conclusion, .event, .workflow_id] | @tsv') || {
              echo "snapshot_diff=FAIL category=manifest_run_not_successful"
              exit 2
            }
            IFS=$'\t' read -r actual_id status conclusion event actual_workflow_id <<< "$run_fields"
            if [[ "$actual_id" != "$run_id" || "$status" != "completed" || "$conclusion" != "success" || "$event" != "workflow_dispatch" || "$actual_workflow_id" != "$workflow_id" ]]; then
              echo "snapshot_diff=FAIL category=manifest_run_not_successful"
              exit 2
            fi
            artifact_count=$(gh api "repos/$GH_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" --jq "[.artifacts[] | select(.name == \"folketinget-snapshot-manifest-$run_id\" and .expired == false and .size_in_bytes > 0)] | length") || {
              echo "snapshot_diff=FAIL category=manifest_artifact_missing_or_ambiguous"
              exit 2
            }
            if [[ "$artifact_count" != "1" ]]; then
              echo "snapshot_diff=FAIL category=manifest_artifact_missing_or_ambiguous"
              exit 2
            fi
          done
      - name: Validate historical manifest run and artifact
        if: inputs.mode == 'HISTORICAL_SNAPSHOT_BASELINE_DRY_RUN'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          MANIFEST_RUN_ID: ${{ inputs.manifest_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$MANIFEST_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "historical_baseline=FAIL category=workflow_run_id_invalid"
            exit 2
          fi
          workflow_id=$(gh api "repos/$GH_REPOSITORY/actions/workflows/folketinget-backup-poc.yml" --jq '.id') || {
            echo "historical_baseline=FAIL category=manifest_run_not_successful"
            exit 2
          }
          if [[ ! "$workflow_id" =~ ^[0-9]+$ ]]; then
            echo "historical_baseline=FAIL category=manifest_run_not_successful"
            exit 2
          fi
          run_fields=$(gh api "repos/$GH_REPOSITORY/actions/runs/$MANIFEST_RUN_ID" --jq '[.id, .status, .conclusion, .event, .workflow_id] | @tsv') || {
            echo "historical_baseline=FAIL category=manifest_run_not_successful"
            exit 2
          }
          IFS=$'\t' read -r actual_id status conclusion event actual_workflow_id <<< "$run_fields"
          if [[ "$actual_id" != "$MANIFEST_RUN_ID" || "$status" != "completed" || "$conclusion" != "success" || "$event" != "workflow_dispatch" || "$actual_workflow_id" != "$workflow_id" ]]; then
            echo "historical_baseline=FAIL category=manifest_run_not_successful"
            exit 2
          fi
          artifact_count=$(gh api "repos/$GH_REPOSITORY/actions/runs/$MANIFEST_RUN_ID/artifacts?per_page=100" --jq "[.artifacts[] | select(.name == \"folketinget-snapshot-manifest-$MANIFEST_RUN_ID\" and .expired == false and .size_in_bytes > 0)] | length") || {
            echo "historical_baseline=FAIL category=manifest_artifact_missing_or_ambiguous"
            exit 2
          }
          if [[ "$artifact_count" != "1" ]]; then
            echo "historical_baseline=FAIL category=manifest_artifact_missing_or_ambiguous"
            exit 2
          fi
      - name: Download historical manifest artifact
        if: inputs.mode == 'HISTORICAL_SNAPSHOT_BASELINE_DRY_RUN'
        uses: actions/download-artifact@v8
        with:
          name: folketinget-snapshot-manifest-${{ inputs.manifest_run_id }}
          path: ${{ runner.temp }}/folketinget-manifest-${{ inputs.manifest_run_id }}
          run-id: ${{ inputs.manifest_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download older manifest artifact
        if: inputs.mode == 'DIFF_MANIFESTS' || inputs.mode == 'EXTRACT_SNAPSHOT_CANDIDATES' || inputs.mode == 'CLASSIFY_SNAPSHOT_CANDIDATES' || inputs.mode == 'PREPARE_SNAPSHOT_INGESTION' || inputs.mode == 'SNAPSHOT_INGESTION_DRY_RUN'
        uses: actions/download-artifact@v8
        with:
          name: folketinget-snapshot-manifest-${{ inputs.old_run_id }}
          path: ${{ runner.temp }}/folketinget-manifest-old
          run-id: ${{ inputs.old_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download newer manifest artifact
        if: inputs.mode == 'DIFF_MANIFESTS' || inputs.mode == 'EXTRACT_SNAPSHOT_CANDIDATES' || inputs.mode == 'CLASSIFY_SNAPSHOT_CANDIDATES' || inputs.mode == 'PREPARE_SNAPSHOT_INGESTION' || inputs.mode == 'SNAPSHOT_INGESTION_DRY_RUN'
        uses: actions/download-artifact@v8
        with:
          name: folketinget-snapshot-manifest-${{ inputs.new_run_id }}
          path: ${{ runner.temp }}/folketinget-manifest-new
          run-id: ${{ inputs.new_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Compare validated manifests
        if: inputs.mode == 'DIFF_MANIFESTS'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 tools/folketinget_snapshot_diff.py \
            --old "$RUNNER_TEMP/folketinget-manifest-old" \
            --new "$RUNNER_TEMP/folketinget-manifest-new" \
            | tee "$RUNNER_TEMP/folketinget-snapshot-diff.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify and restore official backup
        if: inputs.mode != 'DIFF_MANIFESTS' && inputs.mode != 'HISTORICAL_SNAPSHOT_PRODUCTION_PREFLIGHT'
        env:
          INPUT_CONFIRM_RESTORE: ${{ inputs.confirm_restore }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_OLD_RUN_ID: ${{ inputs.old_run_id }}
          INPUT_NEW_RUN_ID: ${{ inputs.new_run_id }}
          INPUT_MANIFEST_RUN_ID: ${{ inputs.manifest_run_id }}
          OLD_MANIFEST_PATH: ${{ runner.temp }}/folketinget-manifest-old
          NEW_MANIFEST_PATH: ${{ runner.temp }}/folketinget-manifest-new
          HISTORICAL_MANIFEST_PATH: ${{ runner.temp }}/folketinget-manifest-${{ inputs.manifest_run_id }}
          ODA_BACKUP_USERNAME: ${{ secrets.ODA_BACKUP_USERNAME }}
          ODA_BACKUP_PASSWORD: ${{ secrets.ODA_BACKUP_PASSWORD }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 tools/folketinget_backup_poc.py
      - name: Upload validated manifest only
        if: success() && inputs.mode == 'CREATE_MANIFEST_BASELINE'
        uses: actions/upload-artifact@v7
        with:
          name: folketinget-snapshot-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/denmarkbot-folketinget-manifest/manifest.sqlite
          if-no-files-found: error
          retention-days: 2
      - name: Remove temporary manifest files
        if: always() && inputs.mode == 'CREATE_MANIFEST_BASELINE'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          target="$RUNNER_TEMP/denmarkbot-folketinget-manifest"
          if [ -d "$target" ] && [ ! -L "$target" ]; then
            rm -rf -- "$target"
          fi
      - name: Remove downloaded manifest artifacts
        if: always() && (inputs.mode == 'DIFF_MANIFESTS' || inputs.mode == 'EXTRACT_SNAPSHOT_CANDIDATES' || inputs.mode == 'CLASSIFY_SNAPSHOT_CANDIDATES' || inputs.mode == 'PREPARE_SNAPSHOT_INGESTION' || inputs.mode == 'SNAPSHOT_INGESTION_DRY_RUN')
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          for name in folketinget-manifest-old folketinget-manifest-new; do
            target="$RUNNER_TEMP/$name"
            if [ -d "$target" ] && [ ! -L "$target" ]; then
              rm -rf -- "$target"
            fi
          done
      - name: Remove historical manifest artifact
        if: always() && inputs.mode == 'HISTORICAL_SNAPSHOT_BASELINE_DRY_RUN'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          MANIFEST_RUN_ID: ${{ inputs.manifest_run_id }}
        run: |
          set -euo pipefail
          if [[ "$MANIFEST_RUN_ID" =~ ^[0-9]+$ ]]; then
            target="$RUNNER_TEMP/folketinget-manifest-$MANIFEST_RUN_ID"
            if [ "$(dirname "$target")" = "$RUNNER_TEMP" ] && [ -d "$target" ] && [ ! -L "$target" ]; then
              rm -rf -- "$target"
            fi
          fi
