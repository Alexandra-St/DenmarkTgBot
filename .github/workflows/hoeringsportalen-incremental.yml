name: Høringsportalen incremental collection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Choose a no-write dry run or confirmed production ingestion
        required: true
        type: choice
        options:
          - dry_run
          - production_ingest
        default: dry_run
      confirm_production_ingestion:
        description: Confirm a complete collection may be submitted to production
        required: true
        type: boolean
        default: false
  # Future activation requires separate review and the automation enable gate:
  # schedule:
  #   - cron: '17 6,14,22 * * *'

permissions:
  contents: read

concurrency:
  group: hoeringsportalen-incremental
  cancel-in-progress: false

jobs:
  collect-and-submit:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check execution mode and safety gate
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          CONFIRM_PRODUCTION_INGESTION: ${{ inputs.confirm_production_ingestion }}
          HOERINGSPORTALEN_AUTOMATION_ENABLED: ${{ vars.HOERINGSPORTALEN_AUTOMATION_ENABLED }}
        run: python -m collectors.workflow_support gate
      - name: Collect both official feeds
        id: collect
        continue-on-error: true
        run: python -m collectors.main > "$RUNNER_TEMP/hoeringsportalen.json" 2> "$RUNNER_TEMP/collector.log"
      - name: Validate collected records without production writes
        id: dry_run
        if: ${{ steps.gate.outputs.mode == 'dry_run' && steps.collect.outcome == 'success' }}
        continue-on-error: true
        run: python -m collectors.ingestion_client "$RUNNER_TEMP/hoeringsportalen.json" --source hoeringsportalen --mode incremental --dry-run > "$RUNNER_TEMP/ingestion.json" 2> "$RUNNER_TEMP/ingestion.log"
      - name: Submit complete incremental run to production
        id: production_ingest
        if: ${{ steps.gate.outputs.mode == 'production_ingest' && steps.collect.outcome == 'success' }}
        continue-on-error: true
        env:
          INGEST_API_URL: ${{ vars.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
          INGESTION_RUN_ID: ${{ steps.gate.outputs.run_id }}
        run: python -m collectors.ingestion_client "$RUNNER_TEMP/hoeringsportalen.json" --source hoeringsportalen --mode incremental --run-id "$INGESTION_RUN_ID" > "$RUNNER_TEMP/ingestion.json" 2> "$RUNNER_TEMP/ingestion.log"
      - name: Write safe run summary
        if: ${{ always() }}
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GATE_STATUS: ${{ steps.gate.outcome || 'not_run' }}
          RUN_MODE: ${{ steps.gate.outputs.mode || 'rejected' }}
          COLLECT_STATUS: ${{ steps.collect.outcome || 'not_run' }}
          INGEST_STATUS: ${{ (steps.gate.outputs.mode == 'dry_run' && steps.dry_run.outcome) || steps.production_ingest.outcome || 'not_run' }}
        run: python -m collectors.workflow_support summary --collection "$RUNNER_TEMP/hoeringsportalen.json" --ingestion "$RUNNER_TEMP/ingestion.json"
      - name: Fail the run if collection or ingestion failed
        if: ${{ always() && (steps.gate.outcome != 'success' || steps.collect.outcome != 'success' || (steps.gate.outputs.mode == 'dry_run' && steps.dry_run.outcome != 'success') || (steps.gate.outputs.mode == 'production_ingest' && steps.production_ingest.outcome != 'success')) }}
        run: exit 1
