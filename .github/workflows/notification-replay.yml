name: Controlled notification replay

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Committed Folketinget snapshot ingestion run UUID
        required: true
        type: string
      confirm_replay:
        description: Enter REPLAY_COMMITTED_RUN_NOTIFICATIONS to queue and deliver this run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: notification-replay
  cancel-in-progress: false

jobs:
  replay:
    name: Replay committed run notifications
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate and replay notifications
        env:
          REPLAY_RUN_ID: ${{ inputs.run_id }}
          REPLAY_CONFIRMATION: ${{ inputs.confirm_replay }}
          INGEST_API_URL: ${{ vars.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
          NOTIFICATION_QUEUE_AUTOMATION_ENABLED: ${{ vars.NOTIFICATION_QUEUE_AUTOMATION_ENABLED }}
          NOTIFICATION_DELIVERY_AUTOMATION_ENABLED: ${{ vars.NOTIFICATION_DELIVERY_AUTOMATION_ENABLED }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "notification replay requires workflow_dispatch" >&2
            exit 1
          fi
          if [ "$REPLAY_CONFIRMATION" != "REPLAY_COMMITTED_RUN_NOTIFICATIONS" ]; then
            echo "notification replay confirmation rejected" >&2
            exit 1
          fi
          if [ -z "$INGEST_API_URL" ] || [ -z "$INGEST_API_TOKEN" ]; then
            echo "notification replay is not configured" >&2
            exit 1
          fi

          ingestion_file="$(mktemp)"
          chmod 600 "$ingestion_file"
          trap 'rm -f "$ingestion_file"' EXIT
          python3 - "$REPLAY_RUN_ID" "$ingestion_file" <<'PY'
          import json
          import sys
          import uuid

          run_id, output_path = sys.argv[1:]
          try:
              parsed = uuid.UUID(run_id)
          except (ValueError, AttributeError):
              raise SystemExit("notification replay run_id must be a UUID")
          if str(parsed) != run_id.lower():
              raise SystemExit("notification replay run_id must use canonical UUID form")
          payload = {
              "run_id": run_id,
              "status": "COMMITTED",
              "mode": "incremental",
              "state_kind": "snapshot",
              "snapshot_advanced": True,
          }
          with open(output_path, "w", encoding="utf-8") as output:
              json.dump(payload, output, separators=(",", ":"))
          PY

          python3 -m collectors.notification_client "$ingestion_file" --replay --confirm-replay "$REPLAY_CONFIRMATION"
